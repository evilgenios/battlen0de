[pytest]
pythonpath = .
testpaths = tests
# Safety net: a genuine hang (e.g. a future test that accidentally patches
# socket.socket globally instead of scoping it to app.core.warpath.connection
# — see conftest.py's scripted_sockets fixture docstring for why that
# matters once an asyncio event loop is in the process) fails the run
# instead of blocking CI/a terminal indefinitely.
timeout = 30
