name: Identity and tenant isolation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warpath_test
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d warpath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://synthetic:synthetic-test-only@127.0.0.1:5432/warpath_test
      APP_ENV: test
      AUTH_MODE: session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r service/requirements.lock.txt
      - run: python -m pip install pip-audit && pip-audit -r service/requirements.lock.txt
      - run: python -m pytest -q
        working-directory: service
      - run: docker build -t battlenode-service:ci service
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=high
        working-directory: dashboard
      - run: npm test && npx next typegen && npx tsc --noEmit && npm run lint
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
